pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    access_log off;
    error_log /dev/stderr warn;
    server {
        listen unix:/run/lab/web.sock;
        server_name localhost;
        location / {
            add_header X-Mapos-Lab "synthetic-native-isolated" always;
            add_header Content-Security-Policy "connect-src 'self'; img-src 'self' data: blob:; frame-src 'none'; object-src 'none'" always;
            proxy_pass http://app:8000;
            proxy_set_header Host $host:18130;
            proxy_set_header X-Forwarded-For 127.0.0.1;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}
